name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug + Stable (release) APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix permissions
        run: chmod +x ./gradlew

      # Optional signing of the stable APK (repository secrets):
      #   BASEERAT_KEYSTORE_BASE64, BASEERAT_KS_PASS, BASEERAT_KEY_ALIAS, BASEERAT_KEY_PASS
      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.BASEERAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BASEERAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # 1st try: with the optional native libraries (Urdu OCR + chat engine)
      - name: Build (with optional libraries)
        id: full
        continue-on-error: true
        env:
          BASEERAT_KS_PASS: ${{ secrets.BASEERAT_KS_PASS }}
          BASEERAT_KEY_ALIAS: ${{ secrets.BASEERAT_KEY_ALIAS }}
          BASEERAT_KEY_PASS: ${{ secrets.BASEERAT_KEY_PASS }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      # 2nd try: automatically without them, so you always get an APK
      - name: Build fallback (without optional libraries)
        if: steps.full.outcome == 'failure'
        env:
          BASEERAT_KS_PASS: ${{ secrets.BASEERAT_KS_PASS }}
          BASEERAT_KEY_ALIAS: ${{ secrets.BASEERAT_KEY_ALIAS }}
          BASEERAT_KEY_PASS: ${{ secrets.BASEERAT_KEY_PASS }}
        run: |
          echo "::warning::Build with optional libraries failed - built WITHOUT Urdu OCR / chat engine"
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -PoptionalLibs=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Baseerat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Stable (release) APK
        uses: actions/upload-artifact@v4
        with:
          name: Baseerat-stable-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
